name: Build Linux executable

# Compile un executable Linux autonome (BLOQZ) avec PyInstaller.
# - Se lance manuellement (onglet "Actions" -> "Run workflow")
# - Ou automatiquement quand on pousse un tag de version (ex. v1.0.0),
#   auquel cas le binaire est attache a une Release telechargeable.

on:
  workflow_dispatch:        # bouton "Run workflow" dans l'onglet Actions
  push:
    tags:
      - "v*"                # ex. v1.0.0 -> cree une Release avec le binaire

jobs:
  build:
    # ubuntu-22.04 = glibc plus ancienne -> binaire compatible avec plus de distros
    runs-on: ubuntu-22.04

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les bibliotheques systeme (Qt/X11)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libglib2.0-0 \
            libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - name: Installer les dependances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0"

      - name: Compiler l'executable
        run: pyinstaller --clean --noconfirm BLOQZ.spec

      - name: Publier l'executable comme artefact telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: BLOQZ-linux-x86_64
          path: dist/BLOQZ
          if-no-files-found: error

      - name: Attacher a la Release (uniquement sur un tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BLOQZ
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
